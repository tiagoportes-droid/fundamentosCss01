<!doctype html>

          </article>
          <article class="artPocao">
            <button class="btn-compra">
              <img src="./images/potion.png" alt="poção2" />

          </article>
          <article class="artPocao">

              <img src="./images/potion.png" alt="poção3" />

          <article class="artPocao">

              <img src="./images/potion.png" alt="poção5" />

          <article class="artPocao">
            <button class="btn-compra">
              <img src="./images/potion.png" alt="poção8" />

          <article class="artBotao">
            <button id="btnCompra" class="btnCompra">Comprar</button>
          </article>
        </section>
        <section class="distribuida">
          <article class="artBotao">
            <div class="btnComprar" id="resp"></div>

        </section>
      </div>
    </main>

    <footer>
      <div class="cabecalho">
        <p>Rua Antonio, Quitauna</p>
      </div>
    </footer>

</html>
