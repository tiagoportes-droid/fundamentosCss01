<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style/style.css" />
    <title>Loja Illury</title>
  </head>
  <body>
    <header>
      <div class="cabecalho">
        <h1>Lojinha do Illury</h1>
      </div>
    </header>
    
    <main>
      <div class="principal">
        <article class="title">
          <h1>Poção de cura</h1>
        </article>
        
        <div class="distribuicao">
          <article class="artPocao">
            <button class="btn-compra"><img src="./images/potion.png" alt="poção" /></button>
          </article>
          <article class="artPocao">
            <button class="btn-compra"><img src="./images/potion.png" alt="poção2" /></button>
          </article>
          <article class="artPocao">
            <button class="btn-compra"><img src="./images/potion.png" alt="poção3" /></button>
          </article>
          <article class="artPocao">
            <button class="btn-compra"><img src="./images/potion.png" alt="poção4" /></button>
          </article>
        </div>

        <!-- Área única de saldo posicionada corretamente dentro do bloco principal -->
        <article class="saldo">
          <div id="info-loja"></div>
          <script src="saldo.js"></script>
        </article>
      </div>
    </main>

    <footer>
      <div class="cabecalho">
        <h1>Rua Antonio, Quitauna</h1>
      </div>
    </footer>
  </body>
</html>
